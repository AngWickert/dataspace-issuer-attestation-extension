[metadata]
format.version = "1.1"

[versions]
edc = "0.14.0"
edc-build = "1.1.1"
shadow = "8.3.6"
rsApi = "4.0.0"

[libraries]
# edc libs
edc-vault-hashicorp = { module = "org.eclipse.edc:vault-hashicorp", version.ref = "edc" }
edc-junit = { module = "org.eclipse.edc:junit", version.ref = "edc" }

# issuer libs
edc-ih-credentials-spi = { module = "org.eclipse.edc:verifiable-credential-spi", version.ref = "edc" }
edc-ih-spi = { module = "org.eclipse.edc:identity-hub-spi", version.ref = "edc" }
edc-did-spi = { module = "org.eclipse.edc:identity-did-spi", version.ref = "edc" }
edc-ih-issuance-spi = { module = "org.eclipse.edc:issuerservice-issuance-spi", version.ref = "edc" }
edc-lib-core = { module = "org.eclipse.edc:core-lib", version.ref = "edc" }

# web and api libs
edc-spi-web = { module = "org.eclipse.edc:web-spi", version.ref = "edc" }
edc-spi-core = { module = "org.eclipse.edc:core-spi", version.ref = "edc" }
edc-api-auth-spi = { module = "org.eclipse.edc:api-auth-spi", version.ref = "edc" }
jakarta-rsApi = { module = "jakarta.ws.rs:jakarta.ws.rs-api", version.ref = "rsApi" }

# transaction libs
edc-transaction-spi = { module = "org.eclipse.edc:transaction-spi", version.ref = "edc" }
edc-transaction-datasource-spi = { module = "org.eclipse.edc:transaction-datasource-spi", version.ref = "edc" }

# BOM Modules
bom-issuer = { module = "org.eclipse.edc:issuerservice-bom", version.ref = "edc" }
bom-issuer-feat-sql = { module = "org.eclipse.edc:issuerservice-feature-sql-bom", version.ref = "edc" }

[bundles]
issuer = ["bom-issuer", "bom-issuer-feat-sql", "edc-vault-hashicorp"]

[plugins]
edc-build = { id = "org.eclipse.edc.edc-build", version.ref = "edc-build" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
